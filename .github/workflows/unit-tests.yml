name: Unit Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - "build/**"
      - "custom/**"
      - "tests/**"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"
  push:
    branches:
      - main
    paths:
      - "build/**"
      - "custom/**"
      - "tests/**"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"

jobs:
  bats:
    name: BATS unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5

      - name: Install BATS and jq
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run unit tests
        shell: bash
        run: bats --print-output-on-failure tests/unit
